name: Upstream content smoke
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
jobs:
  verify-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -e '.[test]'
      - run: python tools/live_smoke.py --output reports/upstream-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-smoke-report
          path: reports/upstream-smoke.json
