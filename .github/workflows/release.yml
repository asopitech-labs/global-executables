name: Release

# Pushing a tag vX.Y.Z publishes the MCP server in three steps, each only after the
# previous one succeeded: PyPI (Trusted Publishing, environment "pypi"), the GHCR
# image built from Dockerfile.mcp, then server.json to the official MCP Registry
# (GitHub OIDC; namespace io.github.asopitech-labs). No long-lived secret is used.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/asopitech-labs/global-executables-mcp
  MCP_PUBLISHER_VERSION: "1.8.1"
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Tag, package, and server.json versions agree
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, re
          tag = os.environ["TAG"].removeprefix("v")
          text = open("src/global_executables/__init__.py").read()
          package = re.search(r'__version__ = "([^"]+)"', text).group(1)
          server = json.load(open("server.json"))
          versions = {"tag": tag, "__version__": package, "server.json": server["version"]}
          for item in server["packages"]:
              if item["registryType"] == "oci":
                  versions["oci tag"] = item["identifier"].rsplit(":", 1)[1]
              else:
                  versions[item["registryType"]] = item["version"]
          if len(set(versions.values())) != 1:
              raise SystemExit(f"version mismatch: {versions}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={tag}\n")
          PY
      - run: pip install -e '.[test]' build
      - run: pytest
      - run: python -m build
      - name: Wheel ships the schemas and the mcp-name marker
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          names = wheel.namelist()
          assert "global_executables/schema/executable.schema.json" in names, names
          metadata = wheel.read(next(n for n in names if n.endswith("/METADATA"))).decode()
          assert "mcp-name: io.github.asopitech-labs/global-executables" in metadata
          PY
      - name: server.json passes the registry's validation before anything is published
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate server.json
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/, if-no-files-found: error}

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/global-executables/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1

  ghcr:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
            ${{ env.IMAGE }}:latest
          annotations: |
            manifest:io.modelcontextprotocol.server.name=io.github.asopitech-labs/global-executables
      - name: Image answers MCP initialize over stdio
        env:
          REF: ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
        run: |
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release","version":"0"}}}'
            sleep 20
          } | timeout 120 docker run -i --rm "$REF" | tee /tmp/init.json
          grep -q '"version":"${{ needs.build.outputs.version }}"' /tmp/init.json

  mcp-registry:
    needs: [build, pypi, ghcr]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Wait until PyPI serves the release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/global-executables/${VERSION}/json" >/dev/null; then exit 0; fi
            sleep 20
          done
          echo "PyPI does not serve global-executables ${VERSION}" >&2; exit 1
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    needs: [build, pypi, ghcr, mcp-registry]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v${VERSION}" --verify-tag \
            --title "Global Executables v${VERSION}" \
            --notes-file "docs/releases/v${VERSION}.md"
