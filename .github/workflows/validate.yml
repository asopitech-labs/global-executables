name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e '.[test]'
      - run: pytest
      - run: global-executables build fixtures/intermediate/*.jsonl --root /tmp/fixture-validation --snapshot 2026-08-14 --coverage-kind partial
      - run: test -s /tmp/fixture-validation/data/metadata.json
      - name: Validate published dictionary integrity separately
        run: |
          set -o pipefail
          git fetch origin dictionary
          mkdir -p /tmp/published-dictionary
          git archive origin/dictionary data | tar -x -C /tmp/published-dictionary
          test -s /tmp/published-dictionary/data/metadata.json
          python tools/validate_dictionary.py \
            --root /tmp/published-dictionary \
            --schema-root . \
            --integrity-only
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: go.sum
      - name: Validate and build Go crawler bootstrap
        env:
          GOTOOLCHAIN: local
        run: ./tools/go_pipeline.sh check
  go-container:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - name: Build Go test stage
        run: CONTAINER_RUNTIME=docker ./tools/go_image.sh go-test global-executables-go-test
      - name: Build and smoke-test minimal Go runtime image
        run: |
          CONTAINER_RUNTIME=docker ./tools/go_image.sh runtime global-executables-go-crawler:test
          docker run --rm global-executables-go-crawler:test --version
