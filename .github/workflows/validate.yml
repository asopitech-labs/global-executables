name: Validate
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e '.[test]'
      - run: pytest
      - run: global-executables build fixtures/intermediate/*.jsonl --root /tmp/fixture-validation --snapshot 2026-08-14 --coverage-kind partial
      - run: test -s /tmp/fixture-validation/data/metadata.json
