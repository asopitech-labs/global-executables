name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install -e '.[test]'
      - run: pytest
      - run: global-executables build fixtures/intermediate/*.jsonl --root /tmp/fixture-validation --snapshot 2026-08-14 --coverage-kind partial
      - run: test -s /tmp/fixture-validation/data/metadata.json
      - name: Validate published dictionary integrity separately
        run: |
          set -o pipefail
          git fetch --depth=1 origin dictionary
          mkdir -p /tmp/published-dictionary
          git archive origin/dictionary data | tar -x -C /tmp/published-dictionary
          test -s /tmp/published-dictionary/data/metadata.json
          python tools/validate_dictionary.py \
            --root /tmp/published-dictionary \
            --schema-root . \
            --integrity-only
  mcp-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the light stdio MCP image
        run: docker build -f Dockerfile.mcp -t global-executables-mcp:test .
      - name: Image answers initialize and check_executable over stdio with no baked dataset
        run: |
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"check_executable","arguments":{"name":"rg"}}}'
            sleep 20
          } | timeout 120 docker run -i --rm global-executables-mcp:test | tee /tmp/mcp.out
          version=$(python3 -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"", open("src/global_executables/__init__.py").read()).group(1))')
          grep -q "\"version\":\"${version}\"" /tmp/mcp.out
          grep -q '"found":true' /tmp/mcp.out
          docker image inspect global-executables-mcp:test \
            --format '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}' \
            | grep -qx 'io.github.asopitech-labs/global-executables'
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: go.sum
      - name: Validate and build Go crawler bootstrap
        env:
          GOTOOLCHAIN: local
        run: ./tools/go_pipeline.sh check
  go-container:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - name: Build Go test stage
        run: CONTAINER_RUNTIME=docker ./tools/go_image.sh go-test global-executables-go-test
      - name: Build and smoke-test minimal Go runtime image
        run: |
          CONTAINER_RUNTIME=docker ./tools/go_image.sh runtime global-executables-go-crawler:test
          docker run --rm global-executables-go-crawler:test --version
