name: Registry artifact crawl

# Every catalog-walking source is filled from local containers, which have neither the
# six-hour job limit nor the one-run-at-a-time group and run one per registry.  CI
# keeps crates.io, whose whole registry arrives in a single daily dump and which
# therefore finishes inside a job. Both writers share the artifact-data branch, so
# they must never share a source. One daily Last-Modified check avoids downloading an
# unchanged dump or rebuilding derived artifacts from unchanged canonical data.
on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      package_budget:
        description: "Maximum packages/crates per source for this run"
        required: false
        default: "1000"
      byte_budget:
        description: "Maximum downloaded artifact bytes for this run"
        required: false
        default: "5000000000"

permissions:
  contents: write
  actions: write

concurrency:
  group: registry-artifact-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[test]'
      - name: Restore resumable registry state
        run: |
          git fetch origin artifact-data || true
          mkdir -p data/production/intermediate
          if git cat-file -e origin/artifact-data:data/production/registry-state.json 2>/dev/null; then
            git show origin/artifact-data:data/production/registry-state.json > data/production/registry-state.json
          fi
          if git cat-file -e origin/artifact-data:data/production/intermediate/crates.jsonl 2>/dev/null; then
            git show origin/artifact-data:data/production/intermediate/crates.jsonl \
              > data/production/intermediate/crates.jsonl
          fi
      - name: Run bounded artifact inspection
        id: crawl
        continue-on-error: true
        env:
          PACKAGE_BUDGET: ${{ inputs.package_budget || '1000' }}
          BYTE_BUDGET: ${{ inputs.byte_budget || '5000000000' }}
        run: |
          # The report is checked in, so a crawl that dies before writing one would
          # otherwise leave the repository's stale copy to be published over the
          # branch's real progress.
          rm -f reports/registry-artifact-crawl.json
          python tools/registry_artifact_crawl.py \
            --source crates \
            --state data/production/registry-state.json \
            --output-dir data/production/intermediate \
            --report reports/registry-artifact-crawl.json \
            --package-budget "$PACKAGE_BUDGET" \
            --byte-budget "$BYTE_BUDGET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-artifact-crawl-report
          path: reports/registry-artifact-crawl.json
      - name: Publish resumable state and normalized observations
        id: publish
        if: always()
        run: |
          if test -f reports/registry-artifact-crawl.json && \
             jq -e '.sources.crates.unchanged == true' reports/registry-artifact-crawl.json >/dev/null; then
            echo "The crates dump is unchanged; skipping canonical publication."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf /tmp/ci-registry-crates
          mkdir -p /tmp/ci-registry-crates/data/production/intermediate \
            /tmp/ci-registry-crates/reports
          cp data/production/registry-state.json \
            /tmp/ci-registry-crates/data/production/registry-state.json
          if test -f data/production/intermediate/crates.jsonl; then
            cp data/production/intermediate/crates.jsonl \
              /tmp/ci-registry-crates/data/production/intermediate/crates.jsonl
          fi
          if test -f reports/registry-artifact-crawl.json; then
            cp reports/registry-artifact-crawl.json \
              /tmp/ci-registry-crates/reports/registry-artifact-crawl.json
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          publish_output="$(BASE=/tmp/ci-registry SOURCES=crates OBSERVATION_SOURCES=' ' \
            PUBLISH_MAX_ATTEMPTS=3 bash tools/crawl_parallel.sh publish)"
          printf '%s\n' "$publish_output"
          if printf '%s\n' "$publish_output" | grep -qx published; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Queue the next crawl or the generated refresh
        if: always() && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_BUDGET: ${{ inputs.package_budget || '1000' }}
          BYTE_BUDGET: ${{ inputs.byte_budget || '5000000000' }}
          PUBLISHED_CHANGED: ${{ steps.publish.outputs.changed || 'false' }}
        run: |
          if test ! -f reports/registry-artifact-crawl.json; then
            echo "::warning::No crawl report was produced; not queueing a follow-up."
            exit 0
          fi
          if jq -e '.coverage_kind == "exhaustive" and .status == "success"' reports/registry-artifact-crawl.json >/dev/null; then
            if test "$PUBLISHED_CHANGED" = true; then
              # refresh.yml rebuilds dictionary and dispatches Pages after publication.
              gh workflow run refresh.yml --ref main
            else
              echo "The crates dump is unchanged; no derived workflow is needed."
            fi
          else
            gh workflow run registry-artifacts.yml --ref main \
              -f package_budget="$PACKAGE_BUDGET" \
              -f byte_budget="$BYTE_BUDGET"
          fi
      - name: Fail after publishing partial progress
        if: steps.crawl.outcome == 'failure'
        run: exit 1
