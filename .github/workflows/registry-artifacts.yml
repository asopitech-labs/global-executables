name: Registry artifact crawl

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:
    inputs:
      package_budget:
        description: "Maximum packages/crates per source for this run"
        required: false
        default: "1000"
      go_package_budget:
        description: "Maximum Go modules for this run; Go has the largest catalog to catch up"
        required: false
        default: "10000"
      byte_budget:
        description: "Maximum downloaded artifact bytes for this run"
        required: false
        default: "5000000000"

permissions:
  contents: write
  actions: write

concurrency:
  group: registry-artifact-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[test]'
      - name: Restore resumable registry state
        run: |
          git fetch origin artifact-data || true
          mkdir -p data/production/intermediate
          if git cat-file -e origin/artifact-data:data/production/registry-state.json 2>/dev/null; then
            git show origin/artifact-data:data/production/registry-state.json > data/production/registry-state.json
          fi
          for catalog in pypi-projects rubygems-names packagist-packages go-modules; do
            if git cat-file -e origin/artifact-data:data/production/$catalog.txt 2>/dev/null; then
              git show origin/artifact-data:data/production/$catalog.txt > data/production/$catalog.txt
            fi
          done
          for source in npm pypi crates go rubygems packagist; do
            if git cat-file -e origin/artifact-data:data/production/intermediate/$source.jsonl 2>/dev/null; then
              git show origin/artifact-data:data/production/intermediate/$source.jsonl > data/production/intermediate/$source.jsonl
            fi
          done
      - name: Run bounded artifact inspection
        id: crawl
        continue-on-error: true
        env:
          PACKAGE_BUDGET: ${{ inputs.package_budget || '1000' }}
          GO_PACKAGE_BUDGET: ${{ inputs.go_package_budget || '10000' }}
          BYTE_BUDGET: ${{ inputs.byte_budget || '5000000000' }}
        run: |
          python tools/registry_artifact_crawl.py \
            --source npm --source pypi --source crates --source go --source rubygems --source packagist \
            --state data/production/registry-state.json \
            --output-dir data/production/intermediate \
            --report reports/registry-artifact-crawl.json \
            --package-budget "$PACKAGE_BUDGET" \
            --source-package-budget "go=$GO_PACKAGE_BUDGET" \
            --byte-budget "$BYTE_BUDGET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-artifact-crawl-report
          path: reports/registry-artifact-crawl.json
      - name: Publish resumable state and normalized observations
        if: always()
        run: |
          rm -rf /tmp/artifact-publish
          if git show-ref --verify --quiet refs/remotes/origin/artifact-data; then
            git worktree add /tmp/artifact-publish origin/artifact-data
          else
            git worktree add -b artifact-data /tmp/artifact-publish HEAD
          fi
          mkdir -p /tmp/artifact-publish/data/production/intermediate /tmp/artifact-publish/reports
          cp data/production/registry-state.json /tmp/artifact-publish/data/production/registry-state.json
          for catalog in pypi-projects rubygems-names packagist-packages go-modules; do
            if test -f data/production/$catalog.txt; then
              cp data/production/$catalog.txt /tmp/artifact-publish/data/production/$catalog.txt
            fi
          done
          cp data/production/intermediate/*.jsonl /tmp/artifact-publish/data/production/intermediate/ || true
          if test -f reports/registry-artifact-crawl.json; then
            cp reports/registry-artifact-crawl.json /tmp/artifact-publish/reports/registry-artifact-crawl.json
          fi
          git -C /tmp/artifact-publish config user.name github-actions[bot]
          git -C /tmp/artifact-publish config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C /tmp/artifact-publish add -f data/production
          if test -f /tmp/artifact-publish/reports/registry-artifact-crawl.json; then
            git -C /tmp/artifact-publish add -f reports/registry-artifact-crawl.json
          fi
          git -C /tmp/artifact-publish diff --cached --quiet || git -C /tmp/artifact-publish commit -m "Record registry artifact crawl"
          git -C /tmp/artifact-publish push origin HEAD:artifact-data
      - name: Queue the next crawl or the generated refresh
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_BUDGET: ${{ inputs.package_budget || '1000' }}
          GO_PACKAGE_BUDGET: ${{ inputs.go_package_budget || '10000' }}
          BYTE_BUDGET: ${{ inputs.byte_budget || '5000000000' }}
        run: |
          if test ! -f reports/registry-artifact-crawl.json; then
            echo "::warning::No crawl report was produced; not queueing a follow-up."
            exit 0
          fi
          # A run this workflow dispatched with GITHUB_TOKEN does not emit the
          # workflow_run event pages.yml listens for, so publish the page explicitly.
          gh workflow run pages.yml --ref main || echo "::warning::Could not queue the Pages deploy."
          if jq -e '.coverage_kind == "exhaustive" and .status == "success"' reports/registry-artifact-crawl.json >/dev/null; then
            gh workflow run refresh.yml --ref main
          else
            gh workflow run registry-artifacts.yml --ref main \
              -f package_budget="$PACKAGE_BUDGET" \
              -f go_package_budget="$GO_PACKAGE_BUDGET" \
              -f byte_budget="$BYTE_BUDGET"
          fi
      - name: Fail after publishing partial progress
        if: steps.crawl.outcome == 'failure'
        run: exit 1
