name: Collect centrally reserved packages

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: central-reservation-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e .
      - name: Restore artifact-data source checkout
        run: |
          git fetch --depth=1 origin artifact-data
          git worktree add /tmp/central-reservation-publish origin/artifact-data
      - name: Independently revalidate and publish due reservations
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/process_reservations.py /tmp/central-reservation-publish
      - name: Queue normal dictionary refresh
        if: steps.collect.outputs.changed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh.yml --ref main -f refresh_os_samples=false
