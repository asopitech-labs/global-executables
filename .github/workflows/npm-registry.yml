name: npm registry distributed crawl

# Runs are intentionally concurrent. artifact-data reservations prevent duplicate
# ownership, while optimistic Git pushes serialize only the tiny ledger update.
on:
  schedule:
    - cron: "13 */4 * * *"
  workflow_dispatch:
    inputs:
      package_budget:
        description: "Maximum npm requests for this independently reserved unit"
        required: false
        default: "10000"

permissions:
  contents: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[test]'
      - name: Configure Git identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Reserve, crawl, publish, and checkpoint one unit
        env:
          ACTOR: github-${{ github.run_id }}-${{ github.run_attempt }}
          PACKAGE_BUDGET: ${{ inputs.package_budget || '10000' }}
          GE_USER_AGENT: global-executables/1.0 (+https://github.com/${{ github.repository }}; run=${{ github.run_id }})
        run: bash tools/npm_distributed_worker.sh
      - name: Refresh dictionary and status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run refresh.yml --ref main
          gh workflow run pages.yml --ref main
