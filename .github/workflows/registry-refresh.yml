name: Refresh completed registry indexes

# Local containers are temporary completion boosters. CI owns steady-state refreshes
# after a source has reached the end of its catalog.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      package_budget:
        description: "Maximum packages refreshed per source"
        required: false
        default: "3000"
      byte_budget:
        description: "Maximum downloaded artifact bytes per source"
        required: false
        default: "8000000000"

permissions:
  contents: write
  actions: write

concurrency:
  group: registry-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        source: [go, pypi, rubygems, packagist, nuget]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[test]'
      - name: Restore the completed source checkpoint
        id: restore
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          BASE="/tmp/ci-refresh-${SOURCE}" SOURCES="${SOURCE}" OBSERVATION_SOURCES=' ' \
            bash tools/crawl_parallel.sh seed
          state="/tmp/ci-refresh-${SOURCE}/data/production/registry-state"
          if python3 tools/registry_state.py get --state "${state}" --source "${SOURCE}" --scalars | jq -e \
            'select((.catalog_size | type) == "number") | select(.cursor >= .catalog_size) | select(.catalog_complete != false)' \
            >/dev/null; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "${SOURCE} is still owned by the local completion booster."
          fi
      # The schedule cache holds when each package was last checked. It is cache, not
      # history: never committed, and a miss only makes every package due again
      # (docs/OPERATIONS.md "History and cache"). It lives in the workspace so that the
      # runner user owns it; the directory is created here, by the runner, because a
      # directory Docker creates for a bind mount belongs to root. A cache that cannot be
      # restored or saved must never fail the run.
      - name: Prepare the schedule cache
        if: steps.restore.outputs.eligible == 'true'
        run: mkdir -p data/production/cache
      - name: Restore the schedule cache
        if: steps.restore.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: data/production/cache
          key: schedule-v1-${{ matrix.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            schedule-v1-${{ matrix.source }}-
      # A local booster (tools/local_booster.sh) leases buckets of the catalogue and works
      # through their rotation from the owner's machine. While its heartbeat is alive this
      # run leaves them alone; a lease nobody renewed has expired and this run owns the
      # whole catalogue again (docs/OPERATIONS.md "Local booster"). Feed work and retries
      # are never left out.
      - name: Find the buckets a local booster owns
        id: booster
        if: steps.restore.outputs.eligible == 'true'
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          exclude="$(python3 tools/booster.py exclusions --source "${SOURCE}" --ref origin/artifact-data || true)"
          echo "exclude=${exclude}" >> "$GITHUB_OUTPUT"
          if [ -n "${exclude}" ]; then
            echo "A local booster holds buckets ${exclude} of ${SOURCE}; their rotation is left to it."
          else
            echo "No live local booster lease for ${SOURCE}; this run owns the whole rotation."
          fi
      - name: Refresh one transactional batch
        if: steps.restore.outputs.eligible == 'true' && matrix.source != 'nuget'
        env:
          SOURCE: ${{ matrix.source }}
          EXCLUDE: ${{ steps.booster.outputs.exclude }}
          PACKAGE_BUDGET: ${{ inputs.package_budget || '3000' }}
          BYTE_BUDGET: ${{ inputs.byte_budget || '8000000000' }}
        run: |
          docker build --file Dockerfile.go-crawler --target runtime \
            --tag global-executables-go-crawler:ci .
          docker run --rm --init -v "/tmp/ci-refresh-${SOURCE}:/state" \
            -v "${PWD}/data/production/cache:/cache" \
            global-executables-go-crawler:ci crawl --source "${SOURCE}" \
            --cache "/cache/${SOURCE}.cache.gz" \
            ${EXCLUDE:+--rotation-exclude "${EXCLUDE}"} \
            --passes 1 --continuous --package-budget "${PACKAGE_BUDGET}" \
            --byte-budget "${BYTE_BUDGET}"
      - name: Refresh one NuGet batch
        if: steps.restore.outputs.eligible == 'true' && matrix.source == 'nuget'
        env:
          SOURCE: ${{ matrix.source }}
          PACKAGE_BUDGET: ${{ inputs.package_budget || '3000' }}
          BYTE_BUDGET: ${{ inputs.byte_budget || '8000000000' }}
        run: |
          root="/tmp/ci-refresh-${SOURCE}"
          python tools/registry_artifact_crawl.py --source nuget \
            --state "${root}/data/production/registry-state" \
            --output-dir "${root}/data/production/intermediate" \
            --report "${root}/reports/registry-artifact-crawl.json" \
            --cache-dir data/production/cache \
            --package-budget "${PACKAGE_BUDGET}" --byte-budget "${BYTE_BUDGET}"
      - name: Hand the schedule cache back to the runner
        # The crawler container runs as root; the cache action saves as the runner user.
        if: always() && steps.restore.outputs.eligible == 'true'
        continue-on-error: true
        run: |
          sudo chown -R "$(id -u):$(id -g)" data/production/cache || true
          chmod -R u+rwX,go+rX data/production/cache || true
      - uses: actions/upload-artifact@v4
        if: steps.restore.outputs.eligible == 'true'
        with:
          name: registry-refresh-${{ matrix.source }}
          path: /tmp/ci-refresh-${{ matrix.source }}/reports/registry-artifact-crawl.json
      - name: Publish refresh progress and update derived data
        if: steps.restore.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ matrix.source }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          publish_output="$(BASE=/tmp/ci-refresh SOURCES="${SOURCE}" OBSERVATION_SOURCES=' ' \
            PUBLISH_MAX_ATTEMPTS=3 bash tools/crawl_parallel.sh publish)"
          printf '%s\n' "${publish_output}"
          if printf '%s\n' "${publish_output}" | grep -qx 'observations changed'; then
            gh workflow run refresh.yml --ref main
          fi
          if printf '%s\n' "${publish_output}" | grep -qx 'published'; then
            gh workflow run pages.yml --ref main
          fi
