name: Verify and reserve published package discovery

on:
  push:
    branches: [main]
    paths: [.github/workflows/on-demand-discovery.yml]
  workflow_dispatch:
    inputs:
      ecosystem:
        description: Authoritative registry
        required: true
        type: choice
        options: [npm, pypi]
      package:
        description: Exact published package ID supplied by the agent
        required: true
        type: string
      version:
        description: Optional exact release; empty selects the registry current release
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: on-demand-discovery-runner
  cancel-in-progress: false

jobs:
  reserve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e .
      - name: Verify through CLI and MCP protocol and reserve Git intake
        env:
          ECOSYSTEM: ${{ github.event_name == 'push' && 'pypi' || inputs.ecosystem }}
          PACKAGE: ${{ github.event_name == 'push' && 'global-executables' || inputs.package }}
          VERSION: ${{ inputs.version }}
          GLOBAL_EXECUTABLES_INTAKE_REPOSITORY: ${{ github.workspace }}
          GLOBAL_EXECUTABLES_INTAKE_GIT_TIMEOUT: '180'
          GLOBAL_EXECUTABLES_CACHE_DIR: ${{ runner.temp }}/global-executables-cache
          GIT_TERMINAL_PROMPT: '0'
        run: |
          python tools/git_intake_runner_smoke.py \
            --ecosystem "$ECOSYSTEM" --package "$PACKAGE" --version "$VERSION"
      - name: Start central collector
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run git-intake-collector.yml --ref main
