name: Verify installation methods

on:
  pull_request:
    paths: [".github/workflows/verify-installation-methods.yml"]
  push:
    branches: [main]
    paths: [".github/workflows/verify-installation-methods.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: apt installs and invokes a published Debian package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --reinstall --no-install-recommends hello
          test "$(dpkg-query -W -f='${Status}' hello)" = 'install ok installed'
          hello | grep -Fx 'Hello, world!'
          dpkg-query -W -f='hello ${Version} ${Architecture}\n' hello
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm installs and invokes a published command package in a project
        run: |
          mkdir -p "$RUNNER_TEMP/npm-project"
          npm install --prefix "$RUNNER_TEMP/npm-project" --ignore-scripts --no-audit --no-fund -- typescript@7.0.2
          cd "$RUNNER_TEMP/npm-project"
          npm exec -- tsc --version | grep -Fx 'Version 7.0.2'
          npm view typescript@7.0.2 bin --json | grep -F '"tsc"'
          node --version
          npm --version
      - name: npm installs and invokes a published command in user scope
        env:
          NPM_CONFIG_PREFIX: ${{ runner.temp }}/npm-user
        run: |
          mkdir -p "$NPM_CONFIG_PREFIX"
          npm install --global --ignore-scripts --no-audit --no-fund -- typescript@7.0.2
          "$NPM_CONFIG_PREFIX/bin/tsc" --version | grep -Fx 'Version 7.0.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip installs and invokes a published Python command in a venv
        run: |
          python -m venv "$RUNNER_TEMP/pip-project"
          "$RUNNER_TEMP/pip-project/bin/python" -m pip install --disable-pip-version-check black==26.10.1
          "$RUNNER_TEMP/pip-project/bin/black" --version | grep -F '26.10.1'
      - name: pip installs and invokes a published command in user scope
        env:
          PYTHONUSERBASE: ${{ runner.temp }}/pip-user
        run: |
          python -m pip install --disable-pip-version-check --user black==26.10.1
          "$PYTHONUSERBASE/bin/black" --version | grep -F '26.10.1'

  debian:
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    steps:
      - name: apt installs and invokes a published Debian package
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends hello
          test "$(dpkg-query -W -f='${Status}' hello)" = 'install ok installed'
          hello | grep -Fx 'Hello, world!'
          dpkg-query -W -f='hello ${Version} ${Architecture}\n' hello

  macos:
    runs-on: macos-15
    steps:
      - name: Homebrew installs and invokes a published formula
        run: |
          brew update
          if brew list --versions hello >/dev/null 2>&1; then
            brew reinstall hello
          else
            brew install hello
          fi
          "$(brew --prefix hello)/bin/hello" | grep -Fx 'Hello, world!'
          brew list --versions hello
          test "$(brew list --versions hello | awk '{print $2}')" = '2.12.3'
          sw_vers -productVersion
          uname -m
