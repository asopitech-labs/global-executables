<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3000" height="1000" viewBox="0 0 3000 1000" role="img" aria-labelledby="title description">
  <title id="title">Global Executables</title>
  <desc id="description">Find CLI name collisions before you ship.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fcfc"/>
      <stop offset="1" stop-color="#eaf8f6"/>
    </linearGradient>
    <pattern id="lines" width="220" height="220" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <line x1="0" y1="0" x2="0" y2="220" stroke="#0b7594" stroke-width="3" opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="3000" height="1000" fill="url(#background)"/>
  <rect width="3000" height="1000" fill="url(#lines)"/>

  <g transform="translate(425 275)">
    <image x="0" y="0" width="450" height="450" xlink:href="logo.png"/>
    <text x="590" y="190" fill="#082b5c" font-family="'OpenAI Sans','Noto Sans',Arial,sans-serif" font-size="122" font-weight="750">Global Executables</text>
    <text x="596" y="300" fill="#31738a" font-family="'OpenAI Sans','Noto Sans',Arial,sans-serif" font-size="55" font-weight="450">Find CLI name collisions before you ship.</text>
  </g>
</svg>
